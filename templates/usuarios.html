<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - El Club de la Manada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #FFD600; }
        .navbar { background: #FFAA00; border-bottom: 4px solid #000; }
        .card { border: 3px solid #000; border-radius: 15px; }
    </style>
</head>
<body>
    <nav class="navbar p-2 mb-4 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <h5 class="m-0 fw-bold">GESTIÓN DE USUARIOS</h5>
            <div>
                <a href="/panel" class="btn btn-sm btn-outline-dark fw-bold me-2">Volver al Panel</a>
                <a href="/logout" class="btn btn-sm btn-dark">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-3 shadow">
                    <h5>Nuevo Usuario</h5>
                    <form action="/usuarios/crear" method="POST">
                        <input name="username" class="form-control mb-2 border-dark" placeholder="Nombre de usuario" required>
                        <input type="password" name="password" class="form-control mb-2 border-dark" placeholder="Contraseña" required>
                        <select name="rol" class="form-select mb-3 border-dark">
                            <option value="empleado">Empleado (Operador)</option>
                            <option value="admin">Administrador</option>
                        </select>
                        <button class="btn btn-dark w-100 fw-bold">CREAR USUARIO</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="bg-white p-3 rounded shadow border border-dark">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>USUARIO</th>
                                <th>ROL</th>
                                <th>CONTRASEÑA (HASH)</th>
                                <th class="text-end">ACCIÓN</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in usuarios %}
                            <tr>
                                <td class="fw-bold">{{ u.username }}</td>
                                <td>
                                    <span class="badge {{ 'bg-danger' if u.rol == 'admin' else 'bg-secondary' }}">
                                        {{ u.rol | upper }}
                                    </span>
                                </td>
                                <td class="small text-muted font-monospace">{{ u.password[:16] }}...</td>
                                <td class="text-end">
                                    {% if u.username != usuario %}
                                    <form action="/usuarios/eliminar/{{ u.id }}" method="POST" class="d-inline">
                                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                    </form>
                                    {% else %}
                                    <span class="badge bg-light text-dark border">Sesión actual</span>
                                    {% endif %}
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
