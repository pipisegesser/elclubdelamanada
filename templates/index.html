<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Animal - El Club de la Manada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #FFD600; }
        .navbar { background: #FFAA00; border-bottom: 4px solid #000; }
        .card { border: 3px solid #000; border-radius: 15px; }
        .img-box { width: 65px; height: 65px; border: 2px solid #000; border-radius: 50%; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; }
        .img-mascota { width: 100%; height: 100%; object-fit: cover; }
        .cumple-hoy { border: 4px solid #ff4500; animation: scale 0.8s infinite alternate; }
        @keyframes scale { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>
    <nav class="navbar p-2 mb-4 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="/static/portada.jpeg" height="50" class="rounded border border-dark me-2">
                <h5 class="m-0 fw-bold">ESPACIO ANIMAL</h5>
            </div>
            <div>
                <a href="/logout" class="btn btn-sm btn-dark">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario Nuevo Dueño -->
            <div class="col-md-4">
                <div class="card p-3 mb-3 shadow">
                    <h5>Nuevo Dueño</h5>
                    <form action="/agregar-cliente" method="POST">
                        <input name="nombre" class="form-control mb-2 border-dark" placeholder="Nombre" required>
                        <input name="apellido" class="form-control mb-2 border-dark" placeholder="Apellido" required>
                        <input name="telefono" class="form-control mb-2 border-dark" placeholder="WhatsApp (549...)">
                        <input name="direccion" class="form-control mb-2 border-dark" placeholder="Dirección">
                        <button class="btn btn-dark w-100 fw-bold">REGISTRAR DUEÑO</button>
                    </form>
                </div>

                <!-- Buscador -->
                <form action="/" method="GET" class="input-group mb-3">
                    <input name="buscar" value="{{ buscar }}" class="form-control border-dark" placeholder="Buscar...">
                    <button class="btn btn-dark"><i class="bi bi-search"></i></button>
                </form>
            </div>

            <!-- Tabla de Clientes y Mascotas -->
            <div class="col-md-8">
                <div class="bg-white p-3 rounded shadow border border-dark">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th style="width:30%">DUEÑO</th>
                                <th>MASCOTAS</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for f in clientes %}
                            <tr>
                                <td>
                                    {% if f.puntos and f.puntos >= 10 %}
                                    <div class="badge bg-danger d-block mb-1">🏆 PREMIO LISTO</div>
                                    {% endif %}
                                    <div class="fw-bold text-uppercase">{{ f.nombre }} {{ f.apellido }}</div>
                                    <div class="small text-muted mb-1">{{ f.direccion or "" }}</div>
                                    <span class="badge bg-dark text-warning p-2">⭐ {{ f.puntos or 0 }} pts</span>
                                    
                                    <form action="/sumar-punto/{{ f.id }}" method="POST" class="d-inline">
                                        <button class="btn btn-sm btn-success ms-1">+</button>
                                    </form>

                                    {% if f.telefono %}
                                    <a href="https://wa.me/{{ f.telefono }}" target="_blank" class="btn btn-sm btn-outline-success py-0 px-1 ms-1">
                                        <i class="bi bi-whatsapp"></i>
                                    </a>
                                    {% endif %}
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2 mb-3">
                                        <!-- Aquí listarías las mascotas del cliente -->
                                    </div>

                                    <!-- Formulario agregar mascota -->
                                    <form action="/agregar-mascota" method="POST" enctype="multipart/form-data" class="bg-light p-2 rounded border small">
                                        <input type="hidden" name="cid" value="{{ f.id }}">
                                        <div class="row g-1">
                                            <div class="col-6"><input name="nom" class="form-control form-control-sm" placeholder="Nombre mascota" required></div>
                                            <div class="col-6">
                                                <select name="tipo" class="form-select form-select-sm">
                                                    <option value="perro">Perro</option>
                                                    <option value="gato">Gato</option>
                                                    <option value="otro">Otro</option>
                                                </select>
                                            </div>
                                            <div class="col-6"><input type="date" name="cumple" class="form-control form-control-sm"></div>
                                            <div class="col-6"><input type="file" name="foto" class="form-control form-control-sm"></div>
                                            <div class="col-12"><input name="info" class="form-control form-control-sm mb-1" placeholder="Alimento/Notas"></div>
                                            <button class="btn btn-sm btn-dark w-100 fw-bold">AÑADIR MASCOTA</button>
                                        </div>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
