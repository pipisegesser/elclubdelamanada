<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - El Club de la Manada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#FFAA00; height:100vh; display:flex; align-items:center;">
    <div class="container text-center">
        <div class="card mx-auto p-4 shadow" style="max-width:400px; border:4px solid #000; border-radius:20px;">
            <img src="/static/portada.jpeg" class="img-fluid mb-3 rounded border border-dark">
            <h1 class="fw-bold mb-4">LOGIN</h1>
            <form action="/login" method="POST">
                <input type="text" name="usuario" class="form-control mb-3 border-dark" placeholder="Usuario" required>
                <input type="password" name="password" class="form-control mb-4 border-dark" placeholder="Contraseña" required>
                {% if error %}<div class="alert alert-danger py-1 small">Usuario o contraseña incorrectos</div>{% endif %}
                <button class="btn btn-dark w-100 fw-bold">ENTRAR</button>
            </form>
        </div>
    </div>
</body>
</html>
